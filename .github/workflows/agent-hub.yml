name: Build Agent Hub (Windows exe)

on:
  workflow_dispatch:
  push:
    paths:
      - "agent-hub/**"
      - ".github/workflows/agent-hub.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go vet ./... && GOOS=windows go vet ./...
      - run: go test ./...
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AgentHub-windows-x64
          path: agent-hub/dist/AgentHub.exe
